services:
  api:
    image: tratosapp-api:latest
    container_name: tratosapp-api
    restart: unless-stopped
    env_file:
      - /etc/tratosapp/api.env
    environment:
      PORT: 3000
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3000/api/v1/health").then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
